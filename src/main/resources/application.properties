# Frontend'in çalıştığı origin(ler)i buraya, virgülle ayırarak yazın.
# ÜRETİMDE "*" KULLANMAYIN; sadece güvendiğiniz domain(leri) belirtin.
# Ortam değişkeni ile override etmek için: APP_CORS_ALLOWED_ORIGINS=https://example.com
#
# NOT: Bu satır burada AÇIKÇA tanımlı olduğu için WebConfig.java'daki
# @Value(...) anotasyonunun ":" sonrasındaki varsayılan değeri HİÇBİR ZAMAN
# kullanılmıyordu (Spring, bir property herhangi bir kaynakta tanımlıysa
# @Value'nin varsayılanını tamamen yok sayar). Üretim frontend'i Netlify'da
# (https://hypercrypt.netlify.app) yayında olduğu için gerçek izinli liste
# BURADA güncellenmeli -- WebConfig.java'daki değişiklik tek başına yeterli
# değildi, asıl etkili olan (ve öncelikli) kaynak bu dosyadır.
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500,https://hypercrypt.netlify.app,https://*.netlify.app


# i18n: mesaj dosyalari messages_tr.properties / messages_en.properties
# fallback-to-system-locale=false -> sunucunun calistigi makinenin dili ne olursa olsun
# (orn. Docker container Ingilizce locale'de calisiyorsa), sadece bizim tanimladigimiz
# tr/en dosyalarina bakilsin, JVM'in kendi varsayilanina hic yaslanilmasin.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# use-code-as-default-message=true -> anahtar hicbir dosyada (messages.properties
# dahil) bulunamazsa exception firlatmak yerine key'in kendisini (orn.
# "axiom.name.reproduction") doner. Boylece eksik bir ceviri, kullanicinin
# "Sunucuda beklenmedik bir hata olustu" (500) gormesine degil, en kotu
# ihtimalle cig bir key gormesine yol acar - hata fark edilir ve loglanabilir olur.
spring.messages.use-code-as-default-message=true